<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f33">
  <meta name="description" content="CSFC 足球队 · 选择男队或女队，输入对应密码进入主场。">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
  <title>CSFC · 欢迎回到主场</title>
  <link rel="icon" href="./assets/crest.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./gate.css">
  <script src="./gate.js" defer></script>
</head>
<body>
  <main class="gate-layout">
    <section class="gate-story" aria-labelledby="gate-title">
      <div class="gate-brand"><img src="./assets/crest.svg" alt="CSFC 队徽" width="43" height="49"><div><b>CSFC</b><small>FOOTBALL CLUB</small></div></div>
      <svg class="pitch-art" viewBox="0 0 600 860" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="20" y="20" width="560" height="820"/><path d="M20 430h560M175 20v125h250V20M175 840V715h250v125M235 20v45h130V20M235 840v-45h130v45"/><circle cx="300" cy="430" r="80"/><circle cx="300" cy="430" r="3"/><path d="M240 145a75 75 0 0 0 120 0M240 715a75 75 0 0 1 120 0"/></svg>
      <div class="story-copy"><p class="eyebrow">ONE TEAM. ONE PASSION.</p><h1 id="gate-title">因为热爱，<br>我们<span>同场。</span></h1><p>属于队友们的足球故事。<br>下一次上场之前，先回到我们的主场。</p></div>
      <div class="story-footer">OUR GAME. OUR PEOPLE. OUR STORY.</div>
    </section>
    <section class="gate-panel" aria-labelledby="unlock-title">
      <div class="unlock-card">
        <div class="lock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
        <p class="card-eyebrow" id="selected-team-label">CSFC / 男队</p>
        <h2 id="unlock-title">进入男队主场<span style="color:#ed783f">.</span></h2>
        <p class="card-description">选择你的球队，输入对应访问密码，<br>查看队员名册与球场相册。</p>
        <div class="team-selector" role="group" aria-label="选择球队">
          <button class="team-choice selected" type="button" data-team="men" aria-pressed="true"><span class="team-choice-name">男队</span><span class="team-choice-code">MEN'S TEAM</span></button>
          <button class="team-choice" type="button" data-team="women" aria-pressed="false"><span class="team-choice-name">女队</span><span class="team-choice-code">WOMEN'S TEAM</span></button>
        </div>
        <form id="unlock-form">
          <label class="password-label" id="password-label" for="access-password">男队访问密码</label>
          <div class="password-box"><input id="access-password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="输入访问密码" aria-describedby="unlock-status" required><button id="show-password" type="button" aria-controls="access-password" aria-pressed="false">显示</button></div>
          <button id="unlock-submit" type="submit">进入我们的主场 <span aria-hidden="true">↗</span></button>
          <p id="unlock-status" role="status" aria-live="polite"></p>
        </form>
        <div class="card-divider"></div>
        <p class="admin-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg>还没有密码？向球队管理员获取。</p>
        <p class="card-signoff">SEE YOU ON THE PITCH.</p>
        <noscript><p class="noscript">请启用 JavaScript，才能输入密码进入网站。</p></noscript>
      </div>
    </section>
  </main>
</body>
</html>
